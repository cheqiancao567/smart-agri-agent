[project]
name = "smart-agri-agent"
version = "0.1.0"
description = "智慧农业环境监测与决策智能体系统（毕业设计）"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.29.0",
    "paho-mqtt>=2.1.0",
    "python-dotenv>=1.2.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 包源由系统环境变量决定（UV_DEFAULT_INDEX / PIP_INDEX_URL，当前指向清华镜像）。
# 不在这里硬编码 index：换机器时改环境变量比改项目文件更方便，
# 也不会出现「配置里写着 A、环境变量写着 B」的不一致。
# 依赖随开发逐步加入，用 `uv add <包名>` 添加
